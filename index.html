      notableSubtitle: `Showing up to ${HOME_NOTABLE_LIMIT} approved alumni, shuffled on each page refresh.`,
    };

    // =========================================================================
    // Application State & Storage Helpers
    // =========================================================================
    const state = {
      route: 'home',
      selectedSchoolId: null,
      searchQuery: '',
      modQueueSearch: '',
      modAlumniSearch: '',
      modSchoolsSearch: '',
      modCategoriesSearch: '',
      categoryFilter: 'all',
      degreeFilter: 'all',
      tierFilter: 'all',
      isModAuthenticated: false,
      modTab: 'queue',
      editingQueueId: null,
      editingAlumnusId: null,
      editingSchoolId: null,
      editingCategoryId: null,
      showAddAlumnusForm: false,
      showAddSchoolForm: false,
      showAddCategoryForm: false,
      newCategoryColor: '#6366f1',
      editCategoryColor: '#6366f1',
      hoveredFieldPctLabel: '',
      alumni: [],
      schools: [],
      schoolRequests: [],
      categories: [],
      degrees: [],
      about: {
        ...DEFAULT_ABOUT,
        standards: [...DEFAULT_ABOUT.standards],
      },
      homeConfig: {
        ...DEFAULT_HOME,
      },
      sessionNotableOrder: [],
      cardImageToggle: {},
    };

    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        const parsed = JSON.parse(raw);
        if (Array.isArray(fallback)) {
          return Array.isArray(parsed) && parsed.length ? parsed : fallback;
        }
        if (fallback && typeof fallback === 'object') {
          return parsed && typeof parsed === 'object' ? { ...fallback, ...parsed } : fallback;
        }
        return parsed ?? fallback;
      } catch (err) {
        console.warn('Failed to load storage for', key, err);
        return fallback;
      }
    }

    function safeSave(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (err) {
        console.warn('Failed to save storage for', key, err);
      }
    }

    function getNyDateKey(date = new Date()) {
      try {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/New_York',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        }).format(date);
      } catch {
        return date.toISOString().slice(0, 10);
      }
    }

    function formatNyClock(date = new Date()) {
      try {
        return new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true,
          timeZoneName: 'short',
        }).format(date);
      } catch {
        return date.toLocaleString();
      }
    }

    function updateNyClocks() {
      const formatted = formatNyClock(new Date());
      const footerClock = document.getElementById('nyLiveClockFooter');
      if (footerClock) {
        footerClock.textContent = `NY Time: ${formatted}`;
      }
      const aboutClock = document.getElementById('nyLiveClockAbout');
      if (aboutClock) {
        aboutClock.textContent = formatted;
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sanitizeUrl(url) {
      const trimmed = String(url || '').trim();
      if (!trimmed) return '';
      try {
        const parsed = new URL(trimmed);
        if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
          return parsed.href;
        }
        return '';
      } catch {
        return '';
      }
    }

    function showToast(message, tone = 'info') {
      const banner = document.getElementById('toastBanner');
      const content = document.getElementById('toastContent');
      if (!banner || !content) return;
      const toneClasses = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-900 text-emerald-50 border-emerald-700',
        warn: 'bg-amber-900 text-amber-50 border-amber-700',
      };
      content.className = `px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ${toneClasses[tone] || toneClasses.info}`;
      content.textContent = message;
      banner.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2800);
    }

    function buildBackupPayload() {
      return {
        app: 'FamousAlumni.org',
        exportedAt: new Date().toISOString(),
        data: {
          alumni: state.alumni,
          schools: state.schools,
          schoolRequests: state.schoolRequests,
          categories: state.categories,
          degrees: state.degrees,
          about: state.about,
          homeConfig: state.homeConfig,
        },
      };
    }

    function getEstimatedBackupSizeLabel() {
      try {
        const jsonStr = JSON.stringify(buildBackupPayload(), null, 2);
        const bytes = new Blob([jsonStr]).size;
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      } catch {
        return 'Unknown';
      }
    }

    function downloadJsonBackup() {
      try {
        const payload = buildBackupPayload();
        const jsonStr = JSON.stringify(payload, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const dateStamp = getNyDateKey();
        link.href = url;
        link.download = `famousalumni-backup-${dateStamp}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`Downloaded JSON backup (${getEstimatedBackupSizeLabel()}).`, 'success');
      } catch (err) {
        console.warn('Backup download failed:', err);
        showToast('Could not download JSON backup.', 'warn');
      }
    }

    function applyImportedJsonString(rawText) {
      const trimmed = String(rawText || '').trim();
      if (!trimmed) {
        showToast('Paste or select a JSON backup first.', 'warn');
        return;
      }

      try {
        const parsed = JSON.parse(trimmed);
        const src = parsed && typeof parsed === 'object' && parsed.data && typeof parsed.data === 'object'
          ? parsed.data
          : parsed;

        if (!src || typeof src !== 'object') {
          showToast('Invalid JSON backup structure.', 'warn');
          return;
        }

        if (Array.isArray(src.alumni) && src.alumni.length) {
          state.alumni = src.alumni;
          safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
        }
        if (Array.isArray(src.schools) && src.schools.length) {
          state.schools = src.schools;
          safeSave(STORAGE_KEYS.SCHOOLS, state.schools);
        }
        if (Array.isArray(src.schoolRequests)) {
          state.schoolRequests = src.schoolRequests;
          safeSave(STORAGE_KEYS.SCHOOL_REQUESTS, state.schoolRequests);
        }
        if (Array.isArray(src.categories) && src.categories.length) {
          state.categories = src.categories;
          safeSave(STORAGE_KEYS.CATEGORIES, state.categories);
        }
        if (Array.isArray(src.degrees) && src.degrees.length) {
          state.degrees = src.degrees;
          safeSave(STORAGE_KEYS.DEGREES, state.degrees);
        }
        if (src.about && typeof src.about === 'object') {
          state.about = { ...DEFAULT_ABOUT, ...src.about };
          safeSave(STORAGE_KEYS.ABOUT, state.about);
        }
        if (src.homeConfig && typeof src.homeConfig === 'object') {
          state.homeConfig = { ...DEFAULT_HOME, ...src.homeConfig };
          safeSave(STORAGE_KEYS.HOME, state.homeConfig);
        }

        state.sessionNotableOrder = buildSessionNotableOrder(getApprovedAlumni());
        showToast('Imported JSON backup into FamousAlumni.org.', 'success');
        render();
      } catch (err) {
        console.warn('JSON import failed:', err);
        showToast('Invalid JSON format. Please check your input.', 'warn');
      }
    }

    function handleJsonFileInput(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = String(e.target?.result || '');
        const textarea = document.getElementById('modJsonInputTextarea');
        if (textarea) textarea.value = text;
        applyImportedJsonString(text);
      };
      reader.readAsText(file);
    }

    function handleModJsonInputSubmit(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      applyImportedJsonString(fd.get('jsonInput'));
    }

    function getModeBadge(mode) {
      if (mode === 'blue') {
        return { icon: '🌙☁️' };
      }
      if (mode === 'monotone') {
        return { icon: '🌕' };
      }
      return { icon: '☀️' };
    }

    function applyDisplayMode(mode) {
      const resolved = DISPLAY_MODES.includes(mode) ? mode : 'white';
      document.documentElement.setAttribute('data-mode', resolved);
      document.documentElement.classList.toggle('dark', resolved === 'blue' || resolved === 'monotone');

      const badge = getModeBadge(resolved);
      document.querySelectorAll('#themeToggleBtnMobile, #themeToggleBtnDesktop').forEach((btn) => {
        const iconEl = btn.querySelector('.mode-icon');
        if (iconEl) iconEl.textContent = badge.icon;
      });
    }

    function initTheme() {
      const saved = safeLoad(STORAGE_KEYS.THEME, null);
      if (saved && DISPLAY_MODES.includes(saved)) {
        applyDisplayMode(saved);
        return;
      }
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyDisplayMode(prefersDark ? 'blue' : 'white');
    }

    function cycleDisplayMode() {
      const current = document.documentElement.getAttribute('data-mode') || 'white';
      const idx = DISPLAY_MODES.indexOf(current);
      const next = DISPLAY_MODES[(idx + 1) % DISPLAY_MODES.length];
      safeSave(STORAGE_KEYS.THEME, next);
      applyDisplayMode(next);
      const badge = getModeBadge(next);
      showToast(`Display mode: ${badge.icon}`, 'info');
    }

    // =========================================================================
    // Directory Data & Shuffle Helpers
    // =========================================================================
    function getApprovedAlumni() {
      return state.alumni.filter((a) => a.status === 'approved');
    }

    function getPendingAlumni() {
      return state.alumni.filter((a) => a.status === 'pending');
    }

    function getPendingSchoolRequests() {
      return (state.schoolRequests || []).filter((r) => r.status === 'pending');
    }

    function getSchoolById(schoolId) {
      return state.schools.find((s) => s.id === schoolId) || {
        id: schoolId || 'unknown',
        name: 'U.S. College',
        shortName: 'College',
        location: 'United States',
        tier: 'National Research University',
        logoUrl: '',
        description: 'U.S. higher education institution.',
      };
    }

    function getCategoryById(categoryId) {
      return state.categories.find((c) => c.id === categoryId) || {
        id: categoryId || 'general',
        name: 'General',
        color: '#64748b',
        description: 'Notable alumni field.',
      };
    }

    function getSchoolAlumni(schoolId, approvedOnly = true) {
      return state.alumni.filter(
        (a) => a.schoolId === schoolId && (!approvedOnly || a.status === 'approved')
      );
    }

    function getInitials(name) {
      const parts = String(name || 'FA')
        .trim()
        .split(/\s+/)
        .filter(Boolean);
      if (parts.length === 0) return 'FA';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function hashStringToIndex(str, length) {
      if (!length) return 0;
      let hash = 2166136261;
      for (let i = 0; i < str.length; i += 1) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return Math.abs(hash) % length;
    }

    function getDailySpotlightAlumnus() {
      const approved = getApprovedAlumni();
      if (!approved.length) return null;

      const override = safeLoad(STORAGE_KEYS.SPOTLIGHT_OVERRIDE, null);
      const nyKey = getNyDateKey();
      if (override && override.dateKey === nyKey && override.alumnusId) {
        const foundOverride = approved.find((a) => a.id === override.alumnusId);
        if (foundOverride) return foundOverride;
      }

      const explicitDaily = approved.find((a) => a.featuredDaily);
      if (explicitDaily) return explicitDaily;

      const idx = hashStringToIndex(`famousalumni-ny-${nyKey}`, approved.length);
      return approved[idx];
    }

    function buildSessionNotableOrder(approvedList) {
      const pool = [...approvedList];
      for (let i = pool.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.map((item) => item.id);
    }

    function getShuffledNotableAlumni(limit = HOME_NOTABLE_LIMIT) {
      const approved = getApprovedAlumni();
      const orderMap = new Map(state.sessionNotableOrder.map((id, idx) => [id, idx]));
      const sorted = [...approved].sort((a, b) => {
        const idxA = orderMap.has(a.id) ? orderMap.get(a.id) : Number.MAX_SAFE_INTEGER;
        const idxB = orderMap.has(b.id) ? orderMap.get(b.id) : Number.MAX_SAFE_INTEGER;
        return idxA - idxB;
      });
      return typeof limit === 'number' ? sorted.slice(0, limit) : sorted;
    }

    function getActiveAlumnusImage(alumnus) {
      const primary = sanitizeUrl(alumnus.imageUrl);
      const secondary = sanitizeUrl(alumnus.secondaryImageUrl);
      const useSecondary = Boolean(state.cardImageToggle[alumnus.id]) && Boolean(secondary);
      return {
        url: useSecondary ? secondary : primary,
        hasAlternate: Boolean(primary && secondary && primary !== secondary),
        isAlternate: useSecondary,
      };
    }

    function toggleAlumnusCardImage(event, alumnusId) {
      if (event) event.stopPropagation();
      state.cardImageToggle[alumnusId] = !state.cardImageToggle[alumnusId];
      render();
    }

    function getSchoolFieldBreakdown(schoolId) {
      const alumniList = getSchoolAlumni(schoolId, true);
      const total = alumniList.length;
      if (!total) return [];
      const counts = new Map();
      alumniList.forEach((person) => {
        counts.set(person.categoryId, (counts.get(person.categoryId) || 0) + 1);
      });
      return Array.from(counts.entries())
        .map(([categoryId, count]) => {
          const cat = getCategoryById(categoryId);
          return {
            categoryId,
            name: cat.name,
            color: cat.color || '#64748b',
            count,
            pct: Math.round((count / total) * 100),
          };
        })
        .sort((a, b) => b.count - a.count);
    }

    function renderFieldBreakdownBar(schoolId) {
      const breakdown = getSchoolFieldBreakdown(schoolId);
      if (!breakdown.length) {
        return `<p class="text-xs opacity-65 mt-3">No approved alumni in fields yet.</p>`;
      }
      return `
        <div class="mt-3 relative" onclick="event.stopPropagation();">
          <div class="flex items-center justify-between text-[11px] opacity-80 mb-1.5 gap-2">
            <span class="font-medium opacity-75">Field mix</span>
            <span class="opacity-75 shrink-0">${breakdown.length} ${breakdown.length === 1 ? 'field' : 'fields'}</span>
          </div>
          <div class="relative">
            <div
              data-field-popup
              class="hidden pointer-events-none absolute -top-9 left-1/2 -translate-x-1/2 z-20 whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-bold shadow-lg border fa-surface"
            ></div>
            <div
              class="h-3 w-full rounded-full overflow-hidden flex fa-subtle border"
              role="img"
              aria-label="Field of alumnus breakdown"
            >
              ${breakdown
                .map(
                  (item) => `
                    <div
                      style="width: ${Math.max(item.pct, 6)}%; background-color: ${escapeHtml(item.color)};"
                      onmouseenter="const pop = this.parentElement.previousElementSibling; if (pop) { pop.textContent = '${escapeHtml(item.name)}: ${item.pct}% (${item.count})'; pop.classList.remove('hidden'); }"
                      onmouseleave="const pop = this.parentElement.previousElementSibling; if (pop) { pop.classList.add('hidden'); }"
                      class="h-full transition-opacity hover:opacity-80 cursor-pointer"
                    ></div>
                  `
                )
                .join('')}
            </div>
          </div>
          <div class="flex flex-wrap gap-x-3 gap-y-1 mt-2">
            ${breakdown
              .slice(0, 3)
              .map(
                (item) => `
                  <span class="inline-flex items-center gap-1 text-[11px] opacity-85">
                    <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${escapeHtml(item.color)};"></span>
                    ${escapeHtml(item.name)} (${item.pct}%)
                  </span>
                `
              )
              .join('')}
          </div>
        </div>
      `;
    }

    function renderSchoolLogoBadge(school, sizeClass = 'w-11 h-11 text-sm') {
      const safeLogo = sanitizeUrl(school.logoUrl);
      if (safeLogo) {
        return `
          <img
            src="${escapeHtml(safeLogo)}"
            alt="${escapeHtml(school.shortName || school.name)} logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
            class="${sizeClass} rounded-2xl object-cover border fa-subtle shrink-0"
          />
          <span style="display:none;" class="${sizeClass} rounded-2xl fa-avatar font-bold items-center justify-center shrink-0">
            ${escapeHtml(getInitials(school.shortName || school.name))}
          </span>
        `;
      }
      return `
        <span class="${sizeClass} rounded-2xl fa-avatar font-bold inline-flex items-center justify-center shrink-0">
          ${escapeHtml(getInitials(school.shortName || school.name))}
        </span>
      `;
    }

    // =========================================================================
    // Top Google-Style Search Bar (All Pages)
    // =========================================================================
    function syncTopSearchInput() {
      const input = document.getElementById('topGoogleSearchInput');
      const clearBtn = document.getElementById('clearTopSearchBtn');
      if (input && input.value !== state.searchQuery) {
        input.value = state.searchQuery;
      }
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', !state.searchQuery.trim());
      }
    }

    function handleTopSearchInput(val) {
      state.searchQuery = val;
      syncTopSearchInput();
      renderTopSearchDropdown();
      if (state.route === 'colleges') {
        const root = document.getElementById('appRoot');
        if (root) root.innerHTML = renderCollegesView();
      } else if (state.route === 'degrees') {
        const root = document.getElementById('appRoot');
        if (root) root.innerHTML = renderDegreesView();
      } else if (state.route === 'fields' || state.route === 'categories') {
        const root = document.getElementById('appRoot');
        if (root) root.innerHTML = renderCategoriesView();
      }
    }

    function handleTopSearchFocus() {
      if (state.searchQuery.trim()) {
        renderTopSearchDropdown();
      }
    }

    function clearTopSearch() {
      state.searchQuery = '';
      syncTopSearchInput();
      const dropdown = document.getElementById('topSearchDropdown');
      if (dropdown) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
      }
      render();
    }

    function renderTopSearchDropdown() {
      const dropdown = document.getElementById('topSearchDropdown');
      if (!dropdown) return;
      const q = state.searchQuery.trim().toLowerCase();
      if (!q) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
        return;
      }

      const matchedAlumni = getApprovedAlumni()
        .filter((a) => {
          const school = getSchoolById(a.schoolId);
          const field = getCategoryById(a.categoryId);
          return (
            a.name.toLowerCase().includes(q) ||
            (a.notableWorks || '').toLowerCase().includes(q) ||
            (a.overallBio || '').toLowerCase().includes(q) ||
            school.name.toLowerCase().includes(q) ||
            school.shortName.toLowerCase().includes(q) ||
            field.name.toLowerCase().includes(q) ||
            (a.degrees || []).some((d) => d.toLowerCase().includes(q))
          );
        })
        .slice(0, 6);

      const matchedSchools = state.schools
        .filter(
          (s) =>
            s.name.toLowerCase().includes(q) ||
            s.shortName.toLowerCase().includes(q) ||
            s.location.toLowerCase().includes(q) ||
            s.tier.toLowerCase().includes(q)
        )
        .slice(0, 5);

      if (!matchedAlumni.length && !matchedSchools.length) {
        dropdown.innerHTML = `
          <div class="p-4 text-sm opacity-75">
            No matching alumni or colleges found for "<strong>${escapeHtml(state.searchQuery.trim())}</strong>".
          </div>
        `;
        dropdown.classList.remove('hidden');
        return;
      }

      dropdown.innerHTML = `
        <div class="divide-y divide-slate-200/20">
          ${
            matchedSchools.length
              ? `
                <div class="p-2">
                  <div class="px-3 py-1 text-[11px] font-bold uppercase tracking-wider opacity-60">
                    Colleges (${matchedSchools.length})
                  </div>
                  ${matchedSchools
                    .map((s) => {
                      const count = getSchoolAlumni(s.id, true).length;
                      return `
                        <button
                          type="button"
                          onclick="selectSearchSchool('${escapeHtml(s.id)}')"
                          class="w-full text-left px-3 py-2 rounded-xl hover:fa-subtle flex items-center justify-between gap-2 transition"
                        >
                          <div>
                            <div class="text-sm font-semibold">${escapeHtml(s.name)}</div>
                            <div class="text-xs opacity-70">${escapeHtml(s.location)} • ${escapeHtml(s.tier)}</div>
                          </div>
                          <span class="text-xs px-2.5 py-1 rounded-full fa-pill font-semibold shrink-0">${count} alumni</span>
                        </button>
                      `;
                    })
                    .join('')}
                </div>
              `
              : ''
          }
          ${
            matchedAlumni.length
              ? `
                <div class="p-2">
                  <div class="px-3 py-1 text-[11px] font-bold uppercase tracking-wider opacity-60">
                    Famous Alumni (${matchedAlumni.length})
                  </div>
                  ${matchedAlumni
                    .map((a) => {
                      const school = getSchoolById(a.schoolId);
                      const field = getCategoryById(a.categoryId);
                      return `
                        <button
                          type="button"
                          onclick="selectSearchAlumnus('${escapeHtml(a.id)}')"
                          class="w-full text-left px-3 py-2 rounded-xl hover:fa-subtle flex items-center justify-between gap-2 transition"
                        >
                          <div>
                            <div class="text-sm font-semibold">${escapeHtml(a.name)}</div>
                            <div class="text-xs opacity-70">${escapeHtml(school.shortName)} • ${escapeHtml(field.name)}</div>
                          </div>
                          <span class="text-xs opacity-70 shrink-0">View →</span>
                        </button>
                      `;
                    })
                    .join('')}
                </div>
              `
              : ''
          }
        </div>
      `;
      dropdown.classList.remove('hidden');
    }

    function selectSearchSchool(schoolId) {
      const dropdown = document.getElementById('topSearchDropdown');
      if (dropdown) dropdown.classList.add('hidden');
      openCollegeDetail(schoolId);
    }

    function selectSearchAlumnus(alumnusId) {
      const dropdown = document.getElementById('topSearchDropdown');
      if (dropdown) dropdown.classList.add('hidden');
      openAlumnusModal(alumnusId);
    }

    document.addEventListener('click', (event) => {
      const dropdown = document.getElementById('topSearchDropdown');
      const input = document.getElementById('topGoogleSearchInput');
      if (!dropdown || !input) return;
      if (!dropdown.contains(event.target) && event.target !== input) {
        dropdown.classList.add('hidden');
      }
    });

    // =========================================================================
    // Navigation & Modal Controls
    // =========================================================================
    function navigateTo(route) {
      state.route = route;
      if (route !== 'college-detail') {
        state.selectedSchoolId = null;
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openCollegeDetail(schoolId) {
      state.selectedSchoolId = schoolId;

    function toggleCombinedCollegeRequest(checked) {
      const box = document.getElementById('combinedCollegeRequestFields');
      const existingSelect = document.getElementById('existingCollegeSelectWrap');
      if (existingSelect) {
        existingSelect.classList.toggle('hidden', Boolean(checked));
      }
      if (!box) return;
      box.classList.toggle('hidden', !checked);
      box.querySelectorAll('[data-college-req-input]').forEach((el) => {
        el.required = Boolean(checked);
      });
    }

    function handlePublicSubmission(event) {
      event.preventDefault();
      const form = event.target;
      const fd = new FormData(form);
      const name = String(fd.get('name') || '').trim();
      const overallBio = String(fd.get('overallBio') || '').trim();
      if (!name || !overallBio) {
        showToast('Please enter a name and overview bio.', 'warn');
        return;
      }

      let resolvedSchoolId = String(fd.get('schoolId') || state.schools[0]?.id || 'ucla');
      const wantsNewCollege = Boolean(fd.get('requestNewCollege'));
      if (wantsNewCollege) {
        const cName = String(fd.get('reqCollegeName') || '').trim();
        const cShort = String(fd.get('reqCollegeShortName') || '').trim();
        const cLoc = String(fd.get('reqCollegeLocation') || '').trim();
        const cTier = String(fd.get('reqCollegeTier') || SCHOOL_TIERS[0]).trim();
        const cIncline = String(fd.get('reqCollegeIncline') || '').trim();
        const cDesc = String(fd.get('reqCollegeDescription') || '').trim();

        if (!cName || !cShort || !cLoc || !cDesc) {
          showToast('Please fill out the requested college fields.', 'warn');
          return;
        }

        const reqId = `school-req-${Date.now()}`;
        const combinedDesc = cIncline ? `${cDesc} (School Incline: ${cIncline})` : cDesc;
        state.schoolRequests.unshift({
          id: reqId,
          name: cName,
          shortName: cShort,
          location: cLoc,
          tier: cTier,
          schoolIncline: cIncline,
          description: combinedDesc,
          logoUrl: '',
          status: 'pending',
        });
        safeSave(STORAGE_KEYS.SCHOOL_REQUESTS, state.schoolRequests);
        resolvedSchoolId = reqId;
      }

      const selectedDegrees = fd.getAll('degrees').map((v) => String(v));
      const degreeTitle = String(fd.get('degreeTitle') || '').trim();
      const newEntry = {
        id: `pending-${Date.now()}`,
        name,
        schoolId: resolvedSchoolId,
        graduationYear: String(fd.get('graduationYear') || '').trim(),
        degreeTitle,
        degrees: selectedDegrees,
        categoryId: String(fd.get('categoryId') || state.categories[0]?.id || 'film-tv'),
        notableWorks: String(fd.get('notableWorks') || '').trim(),
        overallBio,
        campusNote: String(fd.get('campusNote') || '').trim(),
        sourceUrl: sanitizeUrl(fd.get('sourceUrl')),
        imageUrl: '',
        secondaryImageUrl: '',
        status: 'pending',
        featuredDaily: false,
      };

      state.alumni.unshift(newEntry);
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      form.reset();
      toggleCombinedCollegeRequest(false);
      showToast(
        wantsNewCollege
          ? 'Submitted alumnus and college request to the review queue.'
          : 'Submitted to the review queue in ModView.',
        'success'
      );
      navigateTo('home');
    }

                                <input name="logoUrl" type="url" value="${escapeHtml(school.logoUrl || '')}" placeholder="Logo URL" class="px-3 py-2 rounded-xl border fa-subtle text-sm" />

      if (state.modTab === 'fields') {

                        </div>
                        <button
                          type="button"
                          onclick="if (state.editingCategoryId === '${escapeHtml(field.id)}') { state.editingCategoryId = null; } else { state.editingCategoryId = '${escapeHtml(field.id)}'; state.editCategoryColor = '${escapeHtml(field.color || '#6366f1')}'; } render();"

                                <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border fa-subtle">

                                    value="${escapeHtml(/^#[0-9a-fA-F]{6}$/.test(activeEditColor) ? activeEditColor : '#6366f1')}"

        return `
          <form onsubmit="saveFrontPageSettings(event)" class="fa-surface border rounded-2xl p-6 space-y-4 max-w-2xl">
            <div class="text-xs font-bold uppercase tracking-wider fa-accent-text">Front Page Customization</div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">Hero Badge</label>
              <input name="kicker" value="${escapeHtml(homeCfg.kicker)}" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">Hero Headline</label>
              <input name="headline" value="${escapeHtml(homeCfg.headline)}" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm" />
            </div>

              <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">Hero Subheadline</label>
              <textarea name="subheadline" rows="2" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm">${escapeHtml(homeCfg.subheadline)}</textarea>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">Notable Section Heading</label>
                <input name="notableTitle" value="${escapeHtml(homeCfg.notableTitle)}" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">Today's Spotlight Override (NY)</label>
                <select name="spotlightOverrideId" class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm">

                  ${approved.map((a) => `<option value="${escapeHtml(a.id)}" ${a.id === activeOverrideId ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}

              </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">Notable Section Subtitle</label>
              <input name="notableSubtitle" value="${escapeHtml(homeCfg.notableSubtitle)}" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm" />
            </div>

              Save Front Page
            </button>
          </form>
        `;
      }

      if (state.modTab === 'backup') {
        const estSize = getEstimatedBackupSizeLabel();
        return `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="fa-surface border rounded-2xl p-6 space-y-4">
              <div class="text-xs font-bold uppercase tracking-wider fa-accent-text">JSON Backup Downloader</div>
              <h2 class="text-lg font-extrabold">Download Directory Snapshot</h2>
              <p class="text-sm opacity-80 leading-relaxed">
                Export your current alumni, colleges, college requests, field of alumnus categories, degrees, front page settings, and About page as a <code>.json</code> file.
              </p>
              <div>
                <button
                  type="button"
                  onclick="downloadJsonBackup()"
                  class="px-5 py-2.5 rounded-xl fa-accent-bg text-sm font-semibold shadow-sm"
                >
                  Download JSON Backup
                </button>
                <p id="jsonBackupEstimatedSize" class="text-xs opacity-75 mt-2 font-mono">

      return `
        <form onsubmit="saveAboutSettings(event)" class="fa-surface border rounded-2xl p-6 space-y-4 max-w-2xl">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">About Title</label>
            <input name="title" value="${escapeHtml(state.about.title || DEFAULT_ABOUT.title)}" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider opacity-75 mb-1.5">About Body</label>
            <textarea name="body" rows="6" required class="w-full px-3.5 py-2.5 rounded-xl border fa-subtle text-sm">${escapeHtml(state.about.body || DEFAULT_ABOUT.body)}</textarea>
          </div>
          <button type="submit" class="px-5 py-2.5 rounded-xl fa-accent-bg text-sm font-semibold">
            Save About Page
          </button>

    function saveQueueEdit(event, id) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.alumni = state.alumni.map((item) =>
        item.id === id
          ? {
              ...item,
              name: String(fd.get('name') || item.name).trim(),
              categoryId: String(fd.get('categoryId') || item.categoryId),
              overallBio: String(fd.get('overallBio') || item.overallBio).trim(),
            }
          : item
      );
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      state.editingQueueId = null;
      showToast('Saved queue edits.', 'success');
      render();
    }

    function saveAboutSettings(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.about = {
        ...DEFAULT_ABOUT,
        ...state.about,
        title: String(fd.get('title') || DEFAULT_ABOUT.title).trim(),
        body: String(fd.get('body') || DEFAULT_ABOUT.body).trim(),
      };
      safeSave(STORAGE_KEYS.ABOUT, state.about);
      showToast('Saved About page.', 'success');
      render();
    }

    function handleModLogin(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const user = String(fd.get('username') || '').trim();
      const pass = String(fd.get('password') || '');
      if (user === MOD_CREDENTIALS.username && pass === MOD_CREDENTIALS.password) {
        state.isModAuthenticated = true;
        showToast('Signed in to ModView.', 'success');
        render();
      } else {
        showToast('Invalid credentials.', 'warn');
      }
    }

    function handleModLogout() {
      state.isModAuthenticated = false;
      state.editingQueueId = null;
      showToast('Signed out of ModView.', 'info');
      render();
    }

    function approveQueueItem(id) {
      state.alumni = state.alumni.map((a) => (a.id === id ? { ...a, status: 'approved' } : a));
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      showToast('Approved and published to directory.', 'success');
      render();
    }

    function rejectQueueItem(id) {
      state.alumni = state.alumni.filter((a) => a.id !== id);
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      showToast('Removed item from review queue.', 'info');
      render();
    }

    function approveSchoolRequest(reqId) {
      const req = state.schoolRequests.find((r) => r.id === reqId);
      if (!req) return;
      const baseSlug = req.shortName
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '') || `college-${Date.now()}`;
      const uniqueId = state.schools.some((s) => s.id === baseSlug)
        ? `${baseSlug}-${Date.now()}`
        : baseSlug;

      state.schools.push({
        id: uniqueId,
        name: req.name,
        shortName: req.shortName,
        location: req.location,
        tier: req.tier || SCHOOL_TIERS[0],
        logoUrl: req.logoUrl || '',
        description: req.description,
      });
      safeSave(STORAGE_KEYS.SCHOOLS, state.schools);

      state.schoolRequests = state.schoolRequests.map((r) =>
        r.id === reqId ? { ...r, status: 'approved' } : r
      );
      safeSave(STORAGE_KEYS.SCHOOL_REQUESTS, state.schoolRequests);
      showToast(`Added ${req.name} to Colleges.`, 'success');
      render();
    }

    function rejectSchoolRequest(reqId) {
      state.schoolRequests = state.schoolRequests.filter((r) => r.id !== reqId);
      safeSave(STORAGE_KEYS.SCHOOL_REQUESTS, state.schoolRequests);
      showToast('Removed college request from review queue.', 'info');
      render();
    }

    function handleModAddAlumnus(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const name = String(fd.get('name') || '').trim();
      const overallBio = String(fd.get('overallBio') || '').trim();
      if (!name || !overallBio) {
        showToast('Please provide a name and overview bio.', 'warn');
        return;
      }

      const degrees = String(fd.get('degreesText') || '')
        .split(',')
        .map((d) => d.trim().toUpperCase())
        .filter(Boolean);

      const newAlumnus = {
        id: `alumnus-${Date.now()}`,
        name,
        schoolId: String(fd.get('schoolId') || state.schools[0]?.id || 'ucla'),
        graduationYear: String(fd.get('graduationYear') || '').trim(),
        degrees,
        categoryId: String(fd.get('categoryId') || state.categories[0]?.id || 'film-tv'),
        notableWorks: String(fd.get('notableWorks') || '').trim(),
        overallBio,
        campusNote: String(fd.get('campusNote') || '').trim(),
        sourceUrl: sanitizeUrl(fd.get('sourceUrl')),
        imageUrl: sanitizeUrl(fd.get('imageUrl')),
        secondaryImageUrl: sanitizeUrl(fd.get('secondaryImageUrl')),
        status: 'approved',
        featuredDaily: false,
      };

      state.alumni.unshift(newAlumnus);
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      state.showAddAlumnusForm = false;
      showToast(`Added ${name} to Approved Alumni.`, 'success');
      render();
    }

    function handleModAddSchool(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const name = String(fd.get('name') || '').trim();
      const shortName = String(fd.get('shortName') || '').trim();
      const location = String(fd.get('location') || '').trim();
      const description = String(fd.get('description') || '').trim();
      if (!name || !shortName || !location || !description) {
        showToast('Please fill out all required college fields.', 'warn');
        return;
      }

      const slug = shortName
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '') || `college-${Date.now()}`;
      const id = state.schools.some((s) => s.id === slug) ? `${slug}-${Date.now()}` : slug;

      state.schools.push({
        id,
        name,
        shortName,
        location,
        tier: String(fd.get('tier') || SCHOOL_TIERS[0]),
        logoUrl: sanitizeUrl(fd.get('logoUrl')),
        description,
      });
      safeSave(STORAGE_KEYS.SCHOOLS, state.schools);
      state.showAddSchoolForm = false;
      showToast(`Added ${name}.`, 'success');
      render();
    }

    function normalizeHexColor(rawColor, fallback = '#6366f1') {
      const cleaned = String(rawColor || '').trim();
      if (/^#[0-9a-fA-F]{6}$/.test(cleaned)) {
        return cleaned.toLowerCase();
      }
      if (/^#[0-9a-fA-F]{3}$/.test(cleaned)) {
        const [, r, g, b] = cleaned;
        return `#${r}${r}${g}${g}${b}${b}`.toLowerCase();
      }
      if (/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        return `#${cleaned.toLowerCase()}`;
      }
      return fallback;
    }

    function handleModAddCategory(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const name = String(fd.get('name') || '').trim();
      if (!name) {
        showToast('Please enter a category name.', 'warn');
        return;
      }

      const color = normalizeHexColor(
        fd.get('color') || fd.get('colorPicker') || state.newCategoryColor,
        '#6366f1'
      );
      const description = String(fd.get('description') || '').trim();
      const baseSlug =
        name
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '') || `field-${Date.now()}`;
      const id = state.categories.some((c) => c.id === baseSlug)
        ? `${baseSlug}-${Date.now()}`
        : baseSlug;

      state.categories.push({
        id,
        name,
        color,
        description: description || `Notable alumni in ${name}.`,
      });
      safeSave(STORAGE_KEYS.CATEGORIES, state.categories);
      state.showAddCategoryForm = false;
      state.newCategoryColor = '#6366f1';
      showToast(`Created field category "${name}" (${color}).`, 'success');
      render();
    }

    function saveCategoryEdit(event, id) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const existing = state.categories.find((c) => c.id === id);
      if (!existing) return;

      const name = String(fd.get('name') || existing.name).trim();
      const color = normalizeHexColor(
        fd.get('color') || fd.get('colorPicker') || state.editCategoryColor,
        existing.color || '#6366f1'
      );
      const description = String(fd.get('description') || '').trim();

      state.categories = state.categories.map((c) =>
        c.id === id
          ? {
              ...c,
              name: name || c.name,
              color,
              description,
            }
          : c
      );
      safeSave(STORAGE_KEYS.CATEGORIES, state.categories);
      state.editingCategoryId = null;
      showToast(`Updated "${name || existing.name}" color to ${color}.`, 'success');
      render();
    }

    function saveAlumnusEdit(event, id) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const parsedDegrees = String(fd.get('degreesText') || '')
        .split(',')
        .map((d) => d.trim().toUpperCase())
        .filter(Boolean);

      state.alumni = state.alumni.map((a) =>
        a.id === id
          ? {
              ...a,
              name: String(fd.get('name') || a.name).trim(),
              schoolId: String(fd.get('schoolId') || a.schoolId),
              categoryId: String(fd.get('categoryId') || a.categoryId),
              graduationYear: String(fd.get('graduationYear') || '').trim(),
              degrees: parsedDegrees,
              notableWorks: String(fd.get('notableWorks') || '').trim(),
              overallBio: String(fd.get('overallBio') || a.overallBio).trim(),
              campusNote: String(fd.get('campusNote') || '').trim(),
              sourceUrl: sanitizeUrl(fd.get('sourceUrl')),
              imageUrl: sanitizeUrl(fd.get('imageUrl')),
              secondaryImageUrl: sanitizeUrl(fd.get('secondaryImageUrl')),
            }
          : a
      );
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      state.editingAlumnusId = null;
      showToast('Saved alumnus profile.', 'success');
      render();
    }

    function saveSchoolEdit(event, id) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.schools = state.schools.map((s) =>
        s.id === id
          ? {
              ...s,
              name: String(fd.get('name') || s.name).trim(),
              shortName: String(fd.get('shortName') || s.shortName).trim(),
              location: String(fd.get('location') || s.location).trim(),
              tier: String(fd.get('tier') || s.tier),
              description: String(fd.get('description') || s.description).trim(),
              logoUrl: sanitizeUrl(fd.get('logoUrl')),
            }
          : s
      );
      safeSave(STORAGE_KEYS.SCHOOLS, state.schools);
      state.editingSchoolId = null;
      showToast('Saved college profile.', 'success');
      render();
    }

    function saveFrontPageSettings(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.homeConfig = {
        kicker: String(fd.get('kicker') || DEFAULT_HOME.kicker).trim(),
        headline: String(fd.get('headline') || DEFAULT_HOME.headline).trim(),
        subheadline: String(fd.get('subheadline') || DEFAULT_HOME.subheadline).trim(),
        notableTitle: String(fd.get('notableTitle') || DEFAULT_HOME.notableTitle).trim(),
        notableSubtitle: String(fd.get('notableSubtitle') || DEFAULT_HOME.notableSubtitle).trim(),
      };
      safeSave(STORAGE_KEYS.HOME, state.homeConfig);

      const overrideId = String(fd.get('spotlightOverrideId') || '');
      if (overrideId) {
        safeSave(STORAGE_KEYS.SPOTLIGHT_OVERRIDE, {
          dateKey: getNyDateKey(),
          alumnusId: overrideId,
        });
      } else {
        try {
          localStorage.removeItem(STORAGE_KEYS.SPOTLIGHT_OVERRIDE);
        } catch {}
      }

      showToast('Saved front page settings.', 'success');
      render();
    }

    // =========================================================================
    // Main Render Loop & Bootstrap
    // =========================================================================
    function updateActiveNav() {
      document.querySelectorAll('.nav-link').forEach((btn) => {
        const target = btn.getAttribute('data-nav');
        const active =
          state.route === target ||
          (target === 'colleges' && state.route === 'college-detail');
        btn.classList.toggle('ring-2', active);
        btn.classList.toggle('ring-indigo-500', active);
      });
    }

    function render() {
      updateActiveNav();
      syncTopSearchInput();
      const root = document.getElementById('appRoot');
      if (!root) return;

      switch (state.route) {
        case 'colleges':
          root.innerHTML = renderCollegesView();
          break;
        case 'college-detail':
          root.innerHTML = renderCollegeDetailView();
          break;
        case 'degrees':
          root.innerHTML = renderDegreesView();
          break;
        case 'fields':
        case 'categories':
          root.innerHTML = renderCategoriesView();
          break;
        case 'submit':
          root.innerHTML = renderSubmitView();
          break;
        case 'about':
          root.innerHTML = renderAboutView();
          break;
        case 'modview':
          root.innerHTML = renderModView();
          break;
        case 'home':
        default:
          root.innerHTML = renderHomeView();
          break;
      }

      updateNyClocks();
    }

    function initApp() {
      initTheme();
      state.alumni = safeLoad(STORAGE_KEYS.ALUMNI, DEFAULT_ALUMNI);
      state.schools = safeLoad(STORAGE_KEYS.SCHOOLS, DEFAULT_SCHOOLS);
      state.schoolRequests = safeLoad(STORAGE_KEYS.SCHOOL_REQUESTS, []);
      state.categories = safeLoad(STORAGE_KEYS.CATEGORIES, DEFAULT_CATEGORIES);
      state.degrees = safeLoad(STORAGE_KEYS.DEGREES, DEFAULT_DEGREES);
      state.about = safeLoad(STORAGE_KEYS.ABOUT, DEFAULT_ABOUT);
      state.homeConfig = safeLoad(STORAGE_KEYS.HOME, DEFAULT_HOME);
      state.sessionNotableOrder = buildSessionNotableOrder(getApprovedAlumni());
      render();
      clearInterval(window.__nyClockTimer);
      window.__nyClockTimer = setInterval(updateNyClocks, 1000);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
