    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

      const val = String(raw || '').trim();
      if (!val) return '';
      if (/^https?:\/\//i.test(val)) return val;
      return `https://${val}`;
    }

    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return structuredClone(fallback);
        return JSON.parse(raw);
      } catch {
        return structuredClone(fallback);
      }
    }

    function safeSave(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function showToast(message, type = 'info') {
      const banner = document.getElementById('toastBanner');
      const content = document.getElementById('toastContent');
      if (!banner || !content) return;
      content.textContent = message;
      content.className =
        'px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ' +
        (type === 'success'
          ? 'bg-emerald-900 text-emerald-50 border-emerald-700'
          : type === 'warn'
          ? 'bg-amber-900 text-amber-50 border-amber-700'
          : 'bg-zinc-900 text-white border-zinc-700');
      banner.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2800);
    }

    function generateRandomSalt() {
      if (window.crypto && window.crypto.getRandomValues) {
        const bytes = new Uint8Array(12);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      }
      return `fa-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    // =========================================================================
    // Display Mode (Sun / Crescent+Cloud / Full Moon Monotone) & NY Clock
    // =========================================================================
    function getModeIcon(mode) {
      if (mode === 'blue') return '🌙☁️';
      if (mode === 'monotone') return '🌕';
      return '☀️';
    }

    function applyDisplayMode(mode) {
      const validMode = DISPLAY_MODES.includes(mode) ? mode : 'white';
      document.documentElement.setAttribute('data-mode', validMode);
      safeSave(STORAGE_KEYS.THEME, validMode);
      const icon = getModeIcon(validMode);
      document.querySelectorAll('.mode-icon').forEach((el) => {
        el.textContent = icon;
      });
    }

    function initTheme() {
      const saved = safeLoad(STORAGE_KEYS.THEME, 'white');
      applyDisplayMode(saved);
    }

    function cycleDisplayMode() {
      const current = document.documentElement.getAttribute('data-mode') || 'white';
      const next = DISPLAY_MODES[(DISPLAY_MODES.indexOf(current) + 1) % DISPLAY_MODES.length];
      applyDisplayMode(next);
    }

    function getNyDateKey() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(new Date());
    }

    function updateNyClocks() {
      const formatted = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true,
      }).format(new Date());
      const footerClock = document.getElementById('nyLiveClockFooter');
      if (footerClock) footerClock.textContent = `NY Time: ${formatted}`;
      const aboutClock = document.getElementById('nyLiveClockAbout');
      if (aboutClock) aboutClock.textContent = `${formatted} ET`;
    }

    // =========================================================================
    // Data Selectors & Helpers
    // =========================================================================
    function getApprovedAlumni() {
      return state.alumni.filter((a) => a.status === 'approved');
    }

    function getPendingAlumni() {
      return state.alumni.filter((a) => a.status === 'pending');
    }

    function getSchoolById(id) {
      return (
        state.schools.find((s) => s.id === id) || {
          id: id || 'unknown',
          name: 'Unlisted U.S. College',
          shortName: 'Unlisted',
          location: 'United States',
          tier: 'College',
          incline: '',
          description: '',
        }
      );
    }

    function formatSchoolOptionLabel(school) {
      return `${school.name} (${school.shortName})`;
    }

    function resolveSchoolIdFromInput(rawInput, fallbackSchoolId = '') {
      const val = String(rawInput || '').trim();
      if (!val) return '';
      const lower = val.toLowerCase();
      const exactLabel = state.schools.find(
        (s) => formatSchoolOptionLabel(s).toLowerCase() === lower
      );
      if (exactLabel) return exactLabel.id;
      const exactNameOrShort = state.schools.find(
        (s) => s.name.toLowerCase() === lower || s.shortName.toLowerCase() === lower
      );
      if (exactNameOrShort) return exactNameOrShort.id;
      const partial = state.schools.find(
        (s) =>
          s.name.toLowerCase().includes(lower) ||
          s.shortName.toLowerCase().includes(lower)
      );
      if (partial) return partial.id;
      return fallbackSchoolId;
    }

    function renderSchoolDatalist(listId) {
      return `
        <datalist id="${escapeHtml(listId)}">
          ${state.schools
            .map((s) => `<option value="${escapeHtml(formatSchoolOptionLabel(s))}"></option>`)
            .join('')}
        </datalist>
      `;
    }

    function getCategoryById(id) {
      return (
        state.categories.find((c) => c.id === id) ||
        state.categories[0] || {
          id: 'general',
          name: 'General',
          color: '#6366f1',
          description: '',
        }
      );
    }

    function getSchoolAlumni(schoolId, approvedOnly = true) {
      return state.alumni.filter(
        (a) => a.schoolId === schoolId && (!approvedOnly || a.status === 'approved')
      );
    }

    function getUniversityLeaderboardData() {
      const approved = getApprovedAlumni();
      const totalApproved = approved.length;
      const countsBySchool = new Map();
      approved.forEach((a) => {
        if (!a.schoolId) return;
        countsBySchool.set(a.schoolId, (countsBySchool.get(a.schoolId) || 0) + 1);
      });

      return state.schools
        .map((school) => {
          const count = countsBySchool.get(school.id) || 0;
          const pct = totalApproved > 0 ? (count / totalApproved) * 100 : 0;
          return {
            school,
            count,
            pct,
            pctFormatted: pct.toFixed(1),
          };
        })
        .sort((a, b) => b.count - a.count || a.school.name.localeCompare(b.school.name));
    }

    function getInitials(name) {
      return (
        String(name || '')
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0].toUpperCase())
          .join('') || 'FA'
      );
    }

    function renderAlumnusAvatar(person, customImageUrl = '') {
      const imgUrl = (customImageUrl || person.imageUrl || '').trim();
      const initials = escapeHtml(getInitials(person.name));
      if (imgUrl) {
        return `
          <div class="w-[4.5rem] h-[4.5rem] rounded-2xl overflow-hidden shrink-0 border fa-subtle flex items-center justify-center">
            <img
              src="${escapeHtml(imgUrl)}"
              alt="${escapeHtml(person.name)}"
              class="w-full h-full object-cover"
              onerror="this.parentElement.outerHTML='<div class=\\'w-12 h-12 rounded-2xl fa-avatar font-extrabold text-sm flex items-center justify-center shrink-0\\'>${initials}</div>'"
            />
          </div>
        `;
      }
      return `
        <div class="w-12 h-12 rounded-2xl fa-avatar font-extrabold text-sm flex items-center justify-center shrink-0">
          ${initials}
        </div>
      `;
    }

    function buildSessionNotableOrder(list) {
      const ids = list.map((a) => a.id);
      for (let i = ids.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      return ids;
    }

    function getDailySpotlight(approved) {
      if (!approved.length) return null;
      const dateKey = getNyDateKey();
      const override = safeLoad(STORAGE_KEYS.SPOTLIGHT_OVERRIDE, null);
      if (override && override.dateKey === dateKey) {
        const match = approved.find((a) => a.id === override.alumnusId);
        if (match) return match;
      }
      let hash = 0;
      for (let i = 0; i < dateKey.length; i += 1) {
        hash = (hash * 31 + dateKey.charCodeAt(i)) >>> 0;
      }
      return approved[hash % approved.length];
    }

    // =========================================================================
    // Navigation, Search & Modal
    // =========================================================================
    function navigateTo(route, params = {}) {
      state.route = route;
      if (params.schoolId) state.selectedSchoolId = params.schoolId;
      if (params.categoryId) state.categoryFilter = params.categoryId;
      if (params.degree) state.degreeFilter = params.degree;
      hideTopSearchDropdown();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function syncTopSearchInput() {
      const input = document.getElementById('topGoogleSearchInput');
      const clearBtn = document.getElementById('clearTopSearchBtn');
      if (input && input.value !== state.topSearchQuery) {
        input.value = state.topSearchQuery;
      }
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', !state.topSearchQuery);
      }
    }

    function handleTopSearchInput(val) {
      state.topSearchQuery = val;
      syncTopSearchInput();
      renderTopSearchDropdown();
    }

    function handleTopSearchFocus() {
      if (state.topSearchQuery.trim()) {
        renderTopSearchDropdown();
      }
    }

    function clearTopSearch() {
      state.topSearchQuery = '';
      syncTopSearchInput();
      hideTopSearchDropdown();
    }

    function hideTopSearchDropdown() {
      const dd = document.getElementById('topSearchDropdown');
      if (dd) dd.classList.add('hidden');
    }

    function renderTopSearchDropdown() {
      const dd = document.getElementById('topSearchDropdown');
      if (!dd) return;
      const q = state.topSearchQuery.trim().toLowerCase();
      if (!q) {
        dd.classList.add('hidden');
        return;
      }

      const matchedSchools = state.schools
        .filter(
          (s) =>
            s.name.toLowerCase().includes(q) ||
            s.shortName.toLowerCase().includes(q) ||
            s.location.toLowerCase().includes(q)
        )
        .slice(0, 4);

      const matchedAlumni = getApprovedAlumni()
        .filter((a) => {
          const school = getSchoolById(a.schoolId);
          const field = getCategoryById(a.categoryId);
          const hay = `${a.name} ${school.name} ${school.shortName} ${field.name} ${a.degreeDetail || ''} ${(a.degrees || []).join(' ')} ${a.notableWorks || ''}`.toLowerCase();
          return hay.includes(q);
        })
        .slice(0, 6);

      if (!matchedSchools.length && !matchedAlumni.length) {
        dd.innerHTML = `<div class="p-4 text-xs opacity-75">No matching alumni or U.S. colleges for "${escapeHtml(state.topSearchQuery)}".</div>`;
        dd.classList.remove('hidden');
        return;
      }

      dd.innerHTML = `
        ${
          matchedSchools.length
            ? `
              <div class="px-3.5 py-2 text-[11px] font-bold uppercase tracking-wider opacity-60 border-b border-slate-200/15">
                Colleges
              </div>
              ${matchedSchools
                .map(
                  (s) => `
                    <button
                      type="button"
                      onclick="navigateTo('college-detail', { schoolId: '${escapeHtml(s.id)}' })"
                      class="w-full text-left px-4 py-2.5 hover:fa-subtle flex items-center justify-between gap-2 text-xs transition"
                    >
                      <span class="font-bold">${escapeHtml(s.name)} (${escapeHtml(s.shortName)})</span>
                      <span class="opacity-70">${escapeHtml(s.tier)}</span>
                    </button>
                  `
                )
                .join('')}
            `
            : ''
        }
        ${
          matchedAlumni.length
            ? `
              <div class="px-3.5 py-2 text-[11px] font-bold uppercase tracking-wider opacity-60 border-b border-slate-200/15">
                Alumni
              </div>
              ${matchedAlumni
                .map((a) => {
                  const school = getSchoolById(a.schoolId);
                  return `
                    <button
                      type="button"
                      onclick="hideTopSearchDropdown(); openAlumnusModal('${escapeHtml(a.id)}');"
                      class="w-full text-left px-4 py-2.5 hover:fa-subtle flex items-center justify-between gap-2 text-xs transition"
                    >
                      <div>
                        <div class="font-bold">${escapeHtml(a.name)}</div>
                        <div class="opacity-70">${escapeHtml(a.degreeDetail || (a.degrees || []).join(', '))}</div>
                      </div>
                      <span class="fa-pill px-2 py-0.5 rounded-full font-semibold shrink-0">${escapeHtml(school.shortName)}</span>
                    </button>
                  `;
                })
                .join('')}
            `
            : ''
        }
      `;
      dd.classList.remove('hidden');
    }

      const input = document.getElementById('topGoogleSearchInput');
      const dd = document.getElementById('topSearchDropdown');
      if (dd && input && !dd.contains(e.target) && !input.contains(e.target)) {

    function showBarSegmentTooltip(event, fieldName, pct, count) {
      let tip = document.getElementById('faBarSegmentTooltip');
      if (!tip) {
        tip = document.createElement('div');
        tip.id = 'faBarSegmentTooltip';
        tip.className =
          'fixed z-50 pointer-events-none px-2.5 py-1.5 rounded-lg bg-zinc-900 text-white text-xs font-semibold shadow-lg border border-zinc-700';
        document.body.appendChild(tip);
      }
      tip.textContent = `${fieldName}: ${pct}% (${count})`;
      tip.style.left = `${event.clientX + 12}px`;
      tip.style.top = `${event.clientY - 34}px`;
      tip.classList.remove('hidden');
    }

    function moveBarSegmentTooltip(event) {
      const tip = document.getElementById('faBarSegmentTooltip');
      if (!tip || tip.classList.contains('hidden')) return;
      tip.style.left = `${event.clientX + 12}px`;
      tip.style.top = `${event.clientY - 34}px`;
    }

    function hideBarSegmentTooltip() {
      const tip = document.getElementById('faBarSegmentTooltip');
      if (tip) tip.classList.add('hidden');
    }

      const tiers = ['all', ...SCHOOL_TIERS];
      const filteredSchools = state.schools.filter((s) => {
        if (state.schoolTierFilter !== 'all' && s.tier !== state.schoolTierFilter) return false;
        const members = getSchoolAlumni(s.id, true);
        if (state.schoolRosterFilter === 'full' && members.length < MIN_FULL_GRID) return false;
        if (state.schoolRosterFilter === 'has-alumni' && members.length === 0) return false;
        if (
          state.schoolFieldFilter !== 'all' &&
          !members.some((m) => m.categoryId === state.schoolFieldFilter)
        ) {
          return false;
        }
        return true;

      const hasActiveCollegeFilters =

        state.schoolRosterFilter !== 'all' ||

            ${

    function handlePublicSubmission(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const name = String(fd.get('name') || '').trim();
      const overallBio = String(fd.get('overallBio') || '').trim();
      if (!name || !overallBio) {
        showToast('Please enter the alumnus name and overview bio.', 'warn');
        return;
      }

      let schoolId = String(fd.get('schoolId') || state.schools[0]?.id || 'ucla');
      if (state.submitRequestNewSchool) {
        const newCollegeName = String(fd.get('newCollegeName') || '').trim();
        const newCollegeShort = String(fd.get('newCollegeShortName') || newCollegeName).trim();
        const newCollegeLocation = String(fd.get('newCollegeLocation') || 'United States').trim();
        const newCollegeTier = String(fd.get('newCollegeTier') || SCHOOL_TIERS[0]);
        const newCollegeIncline = String(fd.get('newCollegeIncline') || '').trim();

        if (!newCollegeName) {
          showToast('Please enter the requested college name.', 'warn');
          return;
        }

        const reqId = `school-req-${Date.now()}`;
        state.schoolRequests.unshift({
          id: reqId,
          name: newCollegeName,
          shortName: newCollegeShort,
          location: newCollegeLocation,
          tier: newCollegeTier,
          incline: newCollegeIncline,
          description: newCollegeIncline
            ? `Requested college known for ${newCollegeIncline}.`
            : `${newCollegeName} (${newCollegeTier}).`,
          status: 'pending',
        });
        safeSave(STORAGE_KEYS.SCHOOL_REQUESTS, state.schoolRequests);
        schoolId = reqId;
      }

      const degreeDetail = String(fd.get('degreeDetail') || '').trim();
      const parsedCodes = degreeDetail
        .split(/[^A-Za-z]+/)
        .map((t) => t.toUpperCase())
        .filter((t) => ['BA', 'BS', 'MS', 'MA', 'MFA', 'MBA', 'JD', 'MD', 'PHD'].includes(t));

      state.alumni.unshift({
        id: `pending-${Date.now()}`,
        name,
        schoolId,
        graduationYear: String(fd.get('graduationYear') || '').trim(),
        degrees: parsedCodes.length ? Array.from(new Set(parsedCodes)) : [],
        degreeDetail,
        categoryId: String(fd.get('categoryId') || state.categories[0]?.id || 'business-tech'),
        notableWorks: String(fd.get('notableWorks') || '').trim(),
        overallBio,
        campusNote: String(fd.get('campusNote') || '').trim(),
        sourceUrl: sanitizeUrl(fd.get('sourceUrl')),
        imageUrl: sanitizeUrl(fd.get('imageUrl')),
        secondaryImageUrl: '',
        status: 'pending',
        featuredDaily: false,
      });
      safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
      state.submitRequestNewSchool = false;
      showToast('Submitted to ModView review queue!', 'success');
      navigateTo('home');
    }

    function buildBackupPayload() {
      return {
        exportedAt: new Date().toISOString(),
        version: 'famousalumni-v5',
        alumni: state.alumni,
        schools: state.schools,
        schoolRequests: state.schoolRequests,
        categories: state.categories,
        degrees: state.degrees,
        about: state.about,
        homeConfig: state.homeConfig,
      };
    }

    function getEstimatedBackupSizeLabel() {
      const bytes = new Blob([JSON.stringify(buildBackupPayload())]).size;
      return `${(bytes / 1024).toFixed(2)} KB (${bytes.toLocaleString()} bytes)`;
    }

    function downloadJsonBackup() {
      const jsonStr = JSON.stringify(buildBackupPayload(), null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `famousalumni-backup-${getNyDateKey()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Downloaded JSON backup.', 'success');
    }

    function handleJsonFileInput(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const ta = document.getElementById('modJsonInputTextarea');
        if (ta) ta.value = String(reader.result || '');
      };
      reader.readAsText(file);
    }

    function handleModJsonInputSubmit(event) {
      event.preventDefault();
      const raw = String(new FormData(event.target).get('jsonInput') || '').trim();
      if (!raw) {
        showToast('Paste or load JSON data first.', 'warn');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.alumni)) {
          state.alumni = parsed.alumni;
          safeSave(STORAGE_KEYS.ALUMNI, state.alumni);
        }
        if (Array.isArray(parsed.schools)) {
          state.schools = parsed.schools;
          safeSave(STORAGE_KEYS.SCHOOLS, state.schools);
        }
        if (Array.isArray(parsed.schoolRequests)) {
          state.schoolRequests = parsed.schoolRequests;
          safeSave(STORAGE_KEYS.SCHOOL_REQUESTS, state.schoolRequests);
        }
        if (Array.isArray(parsed.categories)) {
          state.categories = parsed.categories;
          safeSave(STORAGE_KEYS.CATEGORIES, state.categories);
        }
        if (Array.isArray(parsed.degrees)) {
          state.degrees = parsed.degrees;
          safeSave(STORAGE_KEYS.DEGREES, state.degrees);
        }
        if (parsed.about && typeof parsed.about === 'object') {
          state.about = parsed.about;
          safeSave(STORAGE_KEYS.ABOUT, state.about);
        }
        if (parsed.homeConfig && typeof parsed.homeConfig === 'object') {
          state.homeConfig = parsed.homeConfig;
          safeSave(STORAGE_KEYS.HOME, state.homeConfig);
        }
        showToast('Restored directory from JSON.', 'success');
        render();
      } catch {
        showToast('Invalid JSON format.', 'warn');
      }
    }

    function handleModSearchInput(inputEl, stateKey) {
      const start = inputEl.selectionStart;
      const end = inputEl.selectionEnd;
      const inputId = inputEl.id;
      state[stateKey] = inputEl.value;
      render();
      if (inputId) {
        const nextEl = document.getElementById(inputId);
        if (nextEl) {
          nextEl.focus();
          if (typeof start === 'number' && typeof end === 'number') {
            nextEl.setSelectionRange(start, end);
          }
        }
      }
    }

    // =========================================================================
    // ModView Actions: Auth, Approvals, Edits & Deletions
    // =========================================================================
    function sha256FallbackHex(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;
      const hash = [];
      const k = [];
      let primeCounter = 0;
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while ((ascii.length % 64) - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;
      for (let j = 0; j < words.length; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15];
          const w2 = w[i - 2];
          const a = hash[0];
          const e = hash[4];
          const temp1 =
            hash[7] +
            (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ (~e & hash[6])) +
            k[i] +
            (w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] +
                    (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                    w[i - 7] +
                    (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                  0);
          const temp2 =
            (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash.unshift((temp1 + temp2) | 0);
          hash[4] = (hash[4] + temp1) | 0;
          hash.pop();
        }
        for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    async function computeSha256Hex(text) {
      const utf8Bytes = new TextEncoder().encode(text);
      if (window.crypto && window.crypto.subtle) {
        try {
          const digest = await window.crypto.subtle.digest('SHA-256', utf8Bytes);
          return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, '0')).join('');
        } catch {}
      }
      let binary = '';
      for (let i = 0; i < utf8Bytes.length; i++) {
        binary += String.fromCharCode(utf8Bytes[i]);
      }
      return sha256FallbackHex(binary);
    }

    function getActiveModAuthRecord() {
      const saved = safeLoad(STORAGE_KEYS.MOD_CRED_HASH, null);
      if (saved && saved.salt && saved.hashHex) return saved;
      return DEFAULT_MOD_AUTH_RECORD;
    }

    async function ensureDefaultModHash() {
      if (!DEFAULT_MOD_AUTH_RECORD.hashHex) {
        const plain = `${DEFAULT_MOD_AUTH_RECORD.salt}:${DEFAULT_MOD_USER}:${DEFAULT_MOD_PASS}`;
        DEFAULT_MOD_AUTH_RECORD.hashHex = sha256FallbackHex(plain);
        if (window.crypto && window.crypto.subtle) {
          try {
            const utf8Bytes = new TextEncoder().encode(plain);
            const digest = await window.crypto.subtle.digest('SHA-256', utf8Bytes);
            DEFAULT_MOD_AUTH_RECORD.hashHex = Array.from(
              new Uint8Array(digest),
              (b) => b.toString(16).padStart(2, '0')
            ).join('');
          } catch {}
        }
      }
    }

    async function handleModLogin(event) {
      event.preventDefault();
      await ensureDefaultModHash();
      const fd = new FormData(event.target);
      const user = String(fd.get('username') || '').trim();
      const pass = String(fd.get('password') || '');
      const record = getActiveModAuthRecord();
      const computed = await computeSha256Hex(`${record.salt}:${user}:${pass}`);

      if (computed === record.hashHex) {
        state.isModAuthenticated = true;
        state.lastAuthenticatedUser = user;
        safeSave(STORAGE_KEYS.MOD_AUTH, { authenticated: true, user });
        showToast('ModView unlocked.', 'success');
        render();
      } else {
        showToast('Invalid moderator credentials.', 'warn');
      }
    }

    function handleModLogout() {
      state.isModAuthenticated = false;
      state.confirmDeleteKey = null;
      safeSave(STORAGE_KEYS.MOD_AUTH, { authenticated: false });
      render();
    }

    async function handleUpdateModCredentials(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const newUser = String(fd.get('newUsername') || '').trim();
      const newPass = String(fd.get('newPassword') || '');
      const confirmPass = String(fd.get('confirmPassword') || '');
      if (!newUser || newPass.length < 6) {
        showToast('Username required and password must be at least 6 characters.', 'warn');
        return;
      }
      if (newPass !== confirmPass) {
        showToast('Passwords do not match.', 'warn');
        return;
      }
      const salt = generateRandomSalt();
      const hashHex = await computeSha256Hex(`${salt}:${newUser}:${newPass}`);
      safeSave(STORAGE_KEYS.MOD_CRED_HASH, { salt, hashHex });
      state.lastAuthenticatedUser = newUser;
      safeSave(STORAGE_KEYS.MOD_AUTH, { authenticated: true, user: newUser });
      showToast('Updated salted SHA-256 credentials!', 'success');
      render();
    }

    function saveAboutConfig(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.about = {
        title: String(fd.get('title') || DEFAULT_ABOUT.title).trim(),
        body: String(fd.get('body') || DEFAULT_ABOUT.body).trim(),
      };
      safeSave(STORAGE_KEYS.ABOUT, state.about);
      showToast('Updated About Us page.', 'success');
      render();
    }

    // =========================================================================
    // Main Render Loop & Initialization
    // =========================================================================
    function render() {
      syncTopSearchInput();
      document.querySelectorAll('.nav-link').forEach((btn) => {
        const navTarget = btn.getAttribute('data-nav');
        if (navTarget === 'submit') return;
        const active =
          navTarget === state.route ||
          (navTarget === 'colleges' && state.route === 'college-detail');
        btn.classList.toggle('fa-subtle', active);
        btn.classList.toggle('font-bold', active);
      });

      const root = document.getElementById('appRoot');
      if (!root) return;

      if (state.route === 'colleges') {
        root.innerHTML = renderCollegesView();
      } else if (state.route === 'college-detail') {
        root.innerHTML = renderCollegeDetailView();
      } else if (state.route === 'leaderboard') {
        root.innerHTML = renderLeaderboardView();
      } else if (state.route === 'degrees') {
        root.innerHTML = renderDegreesView();
      } else if (state.route === 'fields') {
        root.innerHTML = renderCategoriesView();
      } else if (state.route === 'submit') {
        root.innerHTML = renderSubmitView();
      } else if (state.route === 'about') {
        root.innerHTML = renderAboutView();
      } else if (state.route === 'modview') {
        root.innerHTML = renderModView();
      } else {
        root.innerHTML = renderHomeView();
      }

      updateNyClocks();
    }

    function initApp() {
      initTheme();
      DEFAULT_MOD_AUTH_RECORD.hashHex = sha256FallbackHex(
        `${DEFAULT_MOD_AUTH_RECORD.salt}:${DEFAULT_MOD_USER}:${DEFAULT_MOD_PASS}`
      );
      ensureDefaultModHash();
      state.alumni = safeLoad(STORAGE_KEYS.ALUMNI, DEFAULT_ALUMNI);
      state.schools = safeLoad(STORAGE_KEYS.SCHOOLS, DEFAULT_SCHOOLS);
      state.schoolRequests = safeLoad(STORAGE_KEYS.SCHOOL_REQUESTS, []);
      state.categories = safeLoad(STORAGE_KEYS.CATEGORIES, DEFAULT_CATEGORIES);
      state.degrees = safeLoad(STORAGE_KEYS.DEGREES, DEFAULT_DEGREES);
      state.about = safeLoad(STORAGE_KEYS.ABOUT, DEFAULT_ABOUT);
      state.homeConfig = safeLoad(STORAGE_KEYS.HOME, DEFAULT_HOME);

      const authSession = safeLoad(STORAGE_KEYS.MOD_AUTH, { authenticated: false });
      state.isModAuthenticated = Boolean(authSession && authSession.authenticated);
      state.lastAuthenticatedUser = authSession && authSession.user ? authSession.user : '';

      render();
      setInterval(updateNyClocks, 1000);
    }

    initApp();
  </script>
</body>
</html>
